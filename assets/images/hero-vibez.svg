<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="vibez-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5C2A4D" />
      <stop offset="60%" stop-color="#1C1C1E" />
      <stop offset="100%" stop-color="#121214" />
    </linearGradient>
    <radialGradient id="glow-plum" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#8C3A75" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#8C3A75" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="800" height="450" rx="16" fill="url(#vibez-bg)" stroke="#8C3A75" stroke-width="2"/>
  <circle cx="400" cy="200" r="220" fill="url(#glow-plum)" />

  <!-- Cocktail Glass & Shaker Silhouette Graphic -->
  <g transform="translate(400, 190)" fill="none" stroke="#D98CBF" stroke-width="3" stroke-linecap="round">
    <!-- Martini / Cocktail Glass -->
    <path d="M-60 -50 L60 -50 L0 30 Z" fill="rgba(140, 58, 117, 0.2)"/>
    <line x1="0" y1="30" x2="0" y2="90" />
    <line x1="-35" y1="90" x2="35" y2="90" />
    <!-- Garnish / Lemon Wheel -->
    <circle cx="45" cy="-55" r="18" fill="rgba(201, 162, 75, 0.3)" stroke="#C9A24B" stroke-width="2"/>
    <line x1="45" y1="-73" x2="45" y2="-37" stroke="#C9A24B" stroke-width="1.5"/>
    <line x1="27" y1="-55" x2="63" y2="-55" stroke="#C9A24B" stroke-width="1.5"/>

    <!-- Sparkle Stars -->
    <path d="M-100 -20 Q-100 -40 -120 -40 Q-100 -40 -100 -60 Q-100 -40 -80 -40 Q-100 -40 -100 -20" fill="#C9A24B" stroke="none"/>
    <path d="M110 20 Q110 0 90 0 Q110 0 110 -20 Q110 0 130 0 Q110 0 110 20" fill="#C9A24B" stroke="none"/>
  </g>

  <!-- Typography Banner -->
  <text x="400" y="325" font-family="'Syne', sans-serif" font-size="28" font-weight="800" fill="#F7F5F1" text-anchor="middle">POURED UP VIBEZ</text>
  <text x="400" y="355" font-family="sans-serif" font-size="13" letter-spacing="3" font-weight="600" fill="#D98CBF" text-anchor="middle">POURING UP THE VIBEZ, NOT JUST THE DRINKS</text>

  <!-- Placeholder Tag -->
  <rect x="260" y="395" width="280" height="24" rx="12" fill="#1C1C1E" stroke="#8C3A75" stroke-width="1"/>
  <text x="400" y="411" font-family="sans-serif" font-size="10" font-weight="bold" fill="#D98CBF" text-anchor="middle">SVG PLACEHOLDER — BARTENDING HERO</text>
</svg>
