<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="sec-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2F4A5C" />
      <stop offset="60%" stop-color="#1C1C1E" />
      <stop offset="100%" stop-color="#121214" />
    </linearGradient>
    <radialGradient id="glow-blue" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#3B6C8C" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#3B6C8C" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="800" height="450" rx="16" fill="url(#sec-bg)" stroke="#3B6C8C" stroke-width="2"/>
  <circle cx="400" cy="200" r="220" fill="url(#glow-blue)" />

  <!-- Security Shield & Check Vector Motif -->
  <g transform="translate(400, 185)" fill="none" stroke="#8BBADA" stroke-width="3">
    <!-- Shield Shape -->
    <path d="M0 -75 L65 -45 V20 C65 65 0 90 0 90 C0 90 -65 65 -65 20 V-45 Z" fill="rgba(47, 74, 92, 0.4)" stroke-width="4"/>
    <!-- Checkmark inside Shield -->
    <path d="M-22 5 L-5 22 L25 -15" stroke="#C9A24B" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Concentric Starburst lines -->
    <circle cx="0" cy="5" r="78" stroke="#3B6C8C" stroke-width="1.5" stroke-dasharray="6,6"/>
  </g>

  <!-- Typography Banner -->
  <text x="400" y="325" font-family="'Cinzel', serif" font-size="26" font-weight="700" fill="#F7F5F1" text-anchor="middle">EVENT &amp; PROPERTY SECURITY</text>
  <text x="400" y="355" font-family="sans-serif" font-size="12" letter-spacing="2" font-weight="600" fill="#8BBADA" text-anchor="middle">LICENSED &amp; TRAINED PROTECTION VIA M.L. SECURITY PARTNERSHIP</text>

  <!-- Placeholder Tag -->
  <rect x="250" y="395" width="300" height="24" rx="12" fill="#1C1C1E" stroke="#3B6C8C" stroke-width="1"/>
  <text x="400" y="411" font-family="sans-serif" font-size="10" font-weight="bold" fill="#8BBADA" text-anchor="middle">SVG PLACEHOLDER — SECURITY HERO</text>
</svg>
