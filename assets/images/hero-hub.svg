<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1C1C1E" />
      <stop offset="50%" stop-color="#28282D" />
      <stop offset="100%" stop-color="#121214" />
    </linearGradient>
    <linearGradient id="gold-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E2B859" />
      <stop offset="100%" stop-color="#C9A24B" />
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#C9A24B" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#C9A24B" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" rx="16" fill="url(#bg-grad)" stroke="#2C2C32" stroke-width="2"/>
  <circle cx="400" cy="225" r="200" fill="url(#glow)" />
  
  <!-- Subtle Grid Lines -->
  <g stroke="#ffffff" stroke-opacity="0.04" stroke-width="1">
    <line x1="0" y1="112" x2="800" y2="112" />
    <line x1="0" y1="225" x2="800" y2="225" />
    <line x1="0" y1="337" x2="800" y2="337" />
    <line x1="200" y1="0" x2="200" y2="450" />
    <line x1="400" y1="0" x2="400" y2="450" />
    <line x1="600" y1="0" x2="600" y2="450" />
  </g>

  <!-- Central Hub Crest -->
  <circle cx="400" cy="225" r="70" fill="#1C1C1E" stroke="url(#gold-grad)" stroke-width="4"/>
  <text x="400" y="215" font-family="'Syne', sans-serif" font-size="32" font-weight="800" fill="url(#gold-grad)" text-anchor="middle">R</text>
  <text x="400" y="240" font-family="sans-serif" font-size="10" letter-spacing="2" font-weight="bold" fill="#F7F5F1" text-anchor="middle">RODRIGUEZ</text>
  <text x="400" y="252" font-family="sans-serif" font-size="8" letter-spacing="1.5" fill="#C9A24B" text-anchor="middle">ENTERPRISES</text>

  <!-- 4 Satellite Service Nodes -->
  <!-- 1. Bartending (Top Left) -->
  <g transform="translate(180, 110)">
    <rect x="-60" y="-35" width="120" height="70" rx="10" fill="#1C1C1E" stroke="#8C3A75" stroke-width="2"/>
    <text x="0" y="-5" font-family="sans-serif" font-size="11" font-weight="bold" fill="#F7F5F1" text-anchor="middle">POURED UP VIBEZ</text>
    <text x="0" y="15" font-family="sans-serif" font-size="9" fill="#D98CBF" text-anchor="middle">Private Bartending</text>
  </g>
  <line x1="240" y1="125" x2="335" y2="185" stroke="#8C3A75" stroke-width="2" stroke-dasharray="4,4"/>

  <!-- 2. Security (Top Right) -->
  <g transform="translate(620, 110)">
    <rect x="-60" y="-35" width="120" height="70" rx="10" fill="#1C1C1E" stroke="#3B6C8C" stroke-width="2"/>
    <text x="0" y="-5" font-family="sans-serif" font-size="11" font-weight="bold" fill="#F7F5F1" text-anchor="middle">SECURITY</text>
    <text x="0" y="15" font-family="sans-serif" font-size="9" fill="#8BBADA" text-anchor="middle">M.L. Security Partner</text>
  </g>
  <line x1="560" y1="125" x2="465" y2="185" stroke="#3B6C8C" stroke-width="2" stroke-dasharray="4,4"/>

  <!-- 3. Appliance Repair (Bottom Left) -->
  <g transform="translate(180, 340)">
    <rect x="-60" y="-35" width="120" height="70" rx="10" fill="#1C1C1E" stroke="#D9732B" stroke-width="2"/>
    <text x="0" y="-5" font-family="sans-serif" font-size="11" font-weight="bold" fill="#F7F5F1" text-anchor="middle">APPLIANCE REPAIR</text>
    <text x="0" y="15" font-family="sans-serif" font-size="9" fill="#F7B583" text-anchor="middle">Fast Tech Diagnosis</text>
  </g>
  <line x1="240" y1="325" x2="335" y2="265" stroke="#D9732B" stroke-width="2" stroke-dasharray="4,4"/>

  <!-- 4. Maintenance (Bottom Right) -->
  <g transform="translate(620, 340)">
    <rect x="-60" y="-35" width="120" height="70" rx="10" fill="#1C1C1E" stroke="#4A7A5D" stroke-width="2"/>
    <text x="0" y="-5" font-family="sans-serif" font-size="11" font-weight="bold" fill="#F7F5F1" text-anchor="middle">MAINTENANCE</text>
    <text x="0" y="15" font-family="sans-serif" font-size="9" fill="#94C4A6" text-anchor="middle">Property & Building</text>
  </g>
  <line x1="560" y1="325" x2="465" y2="265" stroke="#4A7A5D" stroke-width="2" stroke-dasharray="4,4"/>

  <!-- Label Overlay Badge -->
  <rect x="270" y="405" width="260" height="26" rx="13" fill="#28282D" stroke="#C9A24B" stroke-width="1"/>
  <text x="400" y="422" font-family="sans-serif" font-size="10" font-weight="bold" fill="#F7F5F1" text-anchor="middle">SVG PLACEHOLDER - NO AI IMAGERY USED</text>
</svg>
